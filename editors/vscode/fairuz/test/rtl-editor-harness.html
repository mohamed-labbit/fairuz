<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairuz RTL editor harness</title>
  <link rel="stylesheet" href="../media/editor.css">
</head>
<body>
  <div id="container"></div>
  <script>
    const sample = `# اختبار المحرر\nمن textwrap استورد التفاف\n\nدالة اختبر(النص):\n    نتيجة := التفاف(النص، 20)\n    تاكد نتيجة != عدم\n    ارجع نتيجة\n`;
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        if (message.type === "ready") {
          setTimeout(() => window.postMessage({
            type: "setText",
            text: sample,
            version: 1
          }), 0);
        }
        if (message.type === "semanticTokens") {
          setTimeout(() => window.postMessage({
            type: "semanticTokens",
            requestId: message.requestId,
            tokens: []
          }), 0);
        }
      }
    });
  </script>
  <script src="../media/editor.js"></script>
</body>
</html>
