site_name: توثيق فيروز
site_description: مرجع لغة فيروز ووقت تشغيلها ومكتبتها القياسية
docs_dir: docs_ar
site_dir: site_ar
use_directory_urls: false
theme:
  name: mkdocs
  locale: ar
  highlightjs: true
plugins:
  - search
markdown_extensions:
  - fenced_code
  - tables
  - attr_list
  - toc:
      permalink: true
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/fairuz-highlight.js
  - assets/arabic-search.js
  - assets/ui-ar.js
